name: msuser-api
services:
  postgres:
    image: postgres:18
    container_name: selfservice-api-msuser-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MSUSER_POSTGRES_DB}
      POSTGRES_USER: ${MSUSER_POSTGRES_USER}
      POSTGRES_PASSWORD: ${MSUSER_POSTGRES_PASSWORD}
    ports:
      - "${MSUSER_POSTGRES_HOST_PORT:-5432}:${MSUSER_POSTGRES_PORT:-5432}"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - msuser-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d ${MSUSER_POSTGRES_DB} -U ${MSUSER_POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: selfservice-msuser-pgdata

networks:
  msuser-network:
    name: selfservice-msuser-network